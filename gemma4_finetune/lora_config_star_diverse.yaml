# STaR DIVERSE retrain (Q1, 2026-06-30).
#
# The decisive on-policy test. The x1 oversample ablation (lora_config_star_iter1_x1)
# showed star_iter1 regressed because the self-win pool was 3 too-correlated
# trajectories, NOT because of the oversample dose; diversity is the binding
# constraint. This run consumes a DIVERSE, BALANCED pool (design B): the best-of-N
# gate's 3 wins (general12 seeds 9000013/9000024/9000025) plus the corrective
# harvest's wins (winrate seeds 9000209/9000215/9000216/9000226 plus ONE of
# 9000237's five wins) = 8 trajectories over 8 distinct decks, one win per deck so
# no single board dominates (~21% STaR share at x1). Everything else is held
# identical to volume/star_x1 (fresh LoRA from the same int4 base, volume hypers,
# iters 1000), so the held-out delta vs volume isolates exactly the diversity lever.
#
# corpus: dataset_star_diverse = dataset_volume train + (diverse STaR self-win
#   rows x1), fused from BOTH best-of-N pools by run_star_diverse.sh Phase 1
#   (drift-gated byte-faithful prompts, strict-tier completions only).
#   valid/test reused unchanged from dataset_volume (no STaR leakage).
#
# Decision gate: star_diverse BEATS volume on heldout12 -> diversity was the
#   blocker, on-policy SFT works, scale the harvest. Flat/regresses -> SFT-on-
#   self-wins is closed, only RFT/GRPO remains.

model: "mlx-community/Gemma4-E2B-IT-Text-int4"

train: true

data: "dataset_star_diverse"

adapter_path: "adapters_star_diverse"

# --- memory-bounded settings for 16 GB unified memory ---
max_seq_length: 2048
batch_size: 1
num_layers: 16
grad_checkpoint: true

# --- optimization (identical to volume/gate/allsucc/star_iter1/star_x1) ---
learning_rate: 2.0e-4
iters: 1000
steps_per_report: 10
steps_per_eval: 100
save_every: 250
val_batches: 25

# --- LoRA hyperparameters (identical to volume/gate/allsucc/star_iter1/star_x1) ---
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"
